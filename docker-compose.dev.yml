# Local development database. Start with: pnpm dev:db
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: abis
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: abis
    ports:
      - '5432:5432'
    volumes:
      - abis-dev-db:/var/lib/postgresql/data
      - ./scripts/dev-db-init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  abis-dev-db:
